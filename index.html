      if ('serviceWorker' in navigator) {
        const sw = `self.addEventListener('fetch', function(e) {});`;
        const blob = new Blob([sw], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});

    <!-- React Source Code -->
    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useCallback } from 'https://esm.sh/react@18';
        import { createRoot } from 'https://esm.sh/react-dom@18/client';
        import { 
          Users, UserCircle, ShieldAlert, ArrowLeft, Save, 
          CheckCircle, Search, FileText, ChevronDown, ChevronUp, AlertTriangle, 
          Activity, Calendar, MapPin, Plus, X, Key, UploadCloud, Download, Database, Hammer, Moon, Sun, Loader2, FileSpreadsheet, RefreshCw, Smartphone,
          FileImage, ExternalLink, FileCheck, Trash2
        } from 'https://esm.sh/lucide-react@0.292.0';

        // ==========================================
        // 🔴 URL GOOGLE APPS SCRIPT
        // ==========================================
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxqNbdoViJrV3TOjdf-o6h67sKjf8pkbygPT7W-BXxn6tix0O735-fdhwWFDFwwQpLHKA/exec";

        const daftarPendidikan = [
          'D1', 'D2', 'D3', 'D4', 'Informal', 'Lainnya', 'Non Formal', 'Paket A', 'Paket B', 'Paket C', 
          'PAUD', 'Profesi', 'Putus SD', 'S1', 'S2', 'S2 Terapan', 'S3', 'S3 Terapan', 'SD/Sederajat', 
          'SMP/Sederajat', 'SMA/Sederajat', 'SP1', 'SP2', 'Tidak Sekolah', 'TK Sederajat'
        ];
        
        const daftarPekerjaan = [
          'Buruh', 'Karyawan Swasta', 'Lainnya', 'Nelayan', 'Pedagang Besar', 'Pedagang Kecil', 'Pensiunan', 
          'Petani', 'Peternak', 'PNS/TNI/Polri', 'Sudah meninggal', 'Tenaga Kerja Indonesia', 
          'Tidak bekerja', 'Tidak dapat diterapkan', 'Wirausaha', 'Wiraswasta'
        ];
        
        const daftarPenghasilan = [
          'Kurang dari Rp. 500.000', 'Rp. 500.000 - Rp. 999.999', 'Rp. 1.000.000 - Rp. 1.999.999', 
          'Rp. 2.000.000 - Rp. 4.999.999', 'Rp. 5.000.000 - Rp. 20.000.000', 'Lebih dari Rp. 20.000.000', 
          'Tidak Berpenghasilan'
        ];
        
        const bulanIndo = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

        const processSiswaData = (data) => {
            return data.map(s => {
                let nisnStr = String(s.nisn || "").replace(/\D/g, '');
                s._original_nisn = s.nisn; 
                if (nisnStr.length !== 10) {
                    s.nisn = "0000000000"; 
                    s.is_invalid_nisn = true;
                } else {
                    s.nisn = nisnStr;
                }
                return s;
            });
        };

        const initialSiswaData = [];

        const formatAcronyms = (str) => {
            const acronyms = ['SD', 'SMP', 'SMA', 'SMK', 'MI', 'MTS', 'MA', 'TK', 'PAUD', 'UMS', 'UNS', 'UI', 'ITB', 'UGM', 'UIN'];
            let words = str.split(' ');
            return words.map(w => {
                if (acronyms.includes(w.toUpperCase())) return w.toUpperCase();
                if (w.toUpperCase() === 'MTS') return 'MTs';
                return w;
            }).join(' ');
        };

        const smartTitleCase = (str) => {
            if (!str) return '';
            str = str.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
            return formatAcronyms(str);
        };

        const formatGelarCase = (str) => {
            if (!str) return '';
            const parts = str.split(',');
            let name = smartTitleCase(parts[0].trim());
            if (parts.length > 1) {
                let gelars = parts.slice(1).map(g => {
                    let text = g.trim().replace(/\b\w/g, c => c.toUpperCase());
                    return text.replace(/pd/gi, 'Pd')
                               .replace(/ag/gi, 'Ag')
                               .replace(/md/gi, 'Md')
                               .replace(/si/gi, 'Si');
                });
                return `${name}, ${gelars.join(', ')}`;
            }
            return name;
        };

        const formatTanggalIndo = (tglString) => {
          if (!tglString) return '-';
          const parts = tglString.split('-');
          return parts.length === 3 ? `${parseInt(parts[2])} ${bulanIndo[parseInt(parts[1]) - 1]} ${parts[0]}` : tglString;
        };

        // =========================================================================
        // MESIN CERDAS PENGURAI TANGGAL (UPDATE FINAL ANTI GAGAL)
        // =========================================================================
        const parseTanggalIndoToStandard = (val) => {
          if (!val) return '';
          let s = String(val).trim();
          
          // 1. Deteksi Format Mesin ISO dari GAS (misal: "1997-03-16T17:00:00.000Z")
          if (s.includes('T') && s.includes('Z')) {
             const d = new Date(s);
             return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
          }
          
          // 2. Jika sudah berformat kalender YYYY-MM-DD
          if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;

          // 3. Urai format "17 Maret 1997" atau "17-03-1997" atau "17/03/1997"
          let normalized = s.replace(/[\/\-]/g, ' '); 
          let parts = normalized.split(/\s+/);
          
          if (parts.length >= 3) {
             let p1 = parts[0];
             let p2 = parts[1];
             let p3 = parts[2];
             
             let y, m, d;
             
             if (p1.length === 4) { // Jika Tahun di depan
                 y = p1; m = p2; d = p3;
             } else { // Jika Tanggal di depan
                 d = p1; m = p2; y = p3;
             }
             
             // Urai Bulan
             let mNum = parseInt(m);
             if (isNaN(mNum)) {
                 let mIdx = bulanIndo.findIndex(b => b.toLowerCase() === m.toLowerCase());
                 mNum = mIdx !== -1 ? mIdx + 1 : 1;
             }
             
             if (y.length === 2) y = parseInt(y) > 50 ? `19${y}` : `20${y}`; // Fix tahun 2 digit
             
             return `${y}-${String(mNum).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          }
          
          return s; // Fallback darurat
        };

        const compressImage = (file, maxWidth = 1000, maxHeight = 1000, quality = 0.6) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
              const img = new Image();
              img.src = event.target.result;
              img.onload = () => {
                let width = img.width;
                let height = img.height;
                if (width > height) {
                  if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; }
                } else {
                  if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                const dataUrl = canvas.toDataURL('image/jpeg', quality);
                resolve(dataUrl.split(',')[1]); 
              };
              img.onerror = err => reject(err);
            };
            reader.onerror = err => reject(err);
          });
        };

        // ==========================================
        // KOMPONEN-KOMPONEN APLIKASI
        // ==========================================

        const SplashScreen = ({ isFading }) => (
            <div className={`fixed inset-0 z-[100] flex flex-col items-center justify-center bg-slate-950 transition-opacity duration-1000 ${isFading ? 'fade-out-splash' : ''}`}>
                <div className="absolute inset-0 overflow-hidden">
                    <div className="absolute top-[-10%] left-[-10%] w-[500px] h-[500px] bg-rose-600/20 rounded-full blur-[120px] animate-ambient-glow"></div>
                    <div className="absolute bottom-[-10%] right-[-10%] w-[500px] h-[500px] bg-indigo-600/20 rounded-full blur-[120px] animate-ambient-glow-delayed"></div>
                </div>

                <div className="relative z-10 flex flex-col items-center text-center animate-float-logo w-full px-6">
                    <div className="w-20 h-20 md:w-24 md:h-24 mb-6 bg-gradient-to-br from-rose-500 via-orange-500 to-indigo-500 rounded-[2rem] shadow-[0_0_50px_rgba(244,63,94,0.4)] flex items-center justify-center p-1 animate-slide-up-1">
                        <div className="w-full h-full bg-slate-950 rounded-[1.8rem] flex items-center justify-center relative overflow-hidden">
                            <ShieldAlert size={40} className="text-white relative z-10" />
                            <div className="absolute inset-0 bg-gradient-to-b from-white/10 to-transparent"></div>
                        </div>
                    </div>

                    <h3 className="text-sm md:text-base font-semibold text-slate-400 tracking-widest uppercase mb-1 animate-slide-up-2">Selamat datang di</h3>
                    <h1 className="text-4xl md:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-rose-400 via-white to-blue-400 tracking-tighter drop-shadow-lg mb-1 animate-slide-up-3">PORTAL DATA</h1>
                    <h2 className="text-[11px] md:text-xs font-black text-indigo-400 tracking-[0.2em] uppercase animate-slide-up-3">SDIT Muhammadiyah Al Kautsar</h2>

                    <div className="mt-8 flex flex-col items-center animate-slide-up-4">
                        <div className="px-4 py-2 rounded-full border border-slate-800 bg-slate-900/50 backdrop-blur-sm mb-4">
                            <p className="text-[10px] font-bold text-slate-300 italic">"Data Valid, Keputusan Presisi."</p>
                        </div>
                        <div className="flex items-center gap-2">
                            <Loader2 size={12} className="text-emerald-500 animate-spin" />
                            <p className="text-[9px] font-bold text-slate-500 uppercase tracking-widest">Sinkronisasi Database</p>
                        </div>
                    </div>
                </div>
            </div>
        );

        const CustomDropdown = React.memo(({ value, onChange, options, placeholder, isChanged, compact = false, darkMode }) => {
          const [isOpen, setIsOpen] = useState(false);
          const [dropUp, setDropUp] = useState(false);
          const dropdownRef = useRef(null);

          const toggleDropdown = () => {
            if (!isOpen && dropdownRef.current) {
              const rect = dropdownRef.current.getBoundingClientRect();
              const spaceBelow = window.innerHeight - rect.bottom;
              setDropUp(spaceBelow < 250); 
            }
            setIsOpen(!isOpen);
          };

          const baseClasses = isChanged || compact
            ? (darkMode ? 'border-2 border-cyan-500 bg-cyan-900/20 text-white' : 'border-2 border-blue-400 bg-blue-50/50 text-blue-900 shadow-inner hover:border-blue-500') 
            : (darkMode ? 'border-2 border-slate-600 bg-slate-800 text-white' : 'border-2 border-slate-300 bg-white text-slate-700');

          return (
            <div className="relative w-full" ref={dropdownRef}>
              <div onClick={toggleDropdown} className={`w-full px-2.5 ${compact ? 'py-2' : 'py-2.5'} text-xs rounded-xl outline-none transition-all font-bold flex items-center justify-between cursor-pointer break-words whitespace-pre-wrap ${baseClasses} ${compact ? 'min-h-[2.25rem]' : 'min-h-[2.75rem]'}`}>
                <span className="pr-3">{value || placeholder}</span>
                <ChevronDown size={14} className={`transition-transform duration-300 ${isOpen ? (dropUp ? 'rotate-180' : 'rotate-180') : 'rotate-0'} ${isChanged ? 'text-blue-500' : 'text-slate-400'} flex-shrink-0`} />
              </div>
              {isOpen && (
                <>
                  <div className="fixed inset-0 z-[60]" onClick={() => setIsOpen(false)}></div>
                  <div className={`absolute z-[70] w-full border rounded-xl shadow-2xl max-h-52 overflow-y-auto overflow-x-hidden animate-in fade-in ${darkMode ? 'bg-slate-800 border-slate-700' : 'bg-white border-slate-200'} ${dropUp ? 'bottom-full mb-1 slide-in-from-bottom-2' : 'top-full mt-1 slide-in-from-top-2'}`}>
                    <div className="p-1">
                      {options.map((opt, idx) => (
                        <div key={idx} onClick={() => { onChange(opt.value || opt); setIsOpen(false); }} className={`p-2.5 text-[10px] md:text-[11px] font-bold rounded-lg cursor-pointer break-words transition-colors ${darkMode ? 'text-slate-300 hover:bg-slate-700 hover:text-white border-b border-slate-700 last:border-0' : 'text-slate-700 hover:bg-blue-50 hover:text-blue-700 border-b border-slate-50 last:border-0'}`}>
                          {opt.label || opt}
                        </div>
                      ))}
                    </div>
                  </div>
                </>
              )}
            </div>
          );
        });

        const FileUploadRow = React.memo(({ label, field, accept, selectedGuru, editForm, handleFormChange, darkMode }) => {
          const isNewUser = selectedGuru?.isNew;
          const currentLink = !isNewUser && selectedGuru ? selectedGuru[field === 'file_kk' ? 'link_kk' : 'link_ijazah'] : null;
          const selectedFile = editForm[field];

          const [isEditing, setIsEditing] = useState(!currentLink);
          const [previewUrl, setPreviewUrl] = useState(null);

          useEffect(() => {
            if (selectedFile) {
              const objectUrl = URL.createObjectURL(selectedFile);
              setPreviewUrl(objectUrl);
              return () => URL.revokeObjectURL(objectUrl);
            } else {
              setPreviewUrl(null);
            }
          }, [selectedFile]);

          useEffect(() => {
            setIsEditing(!currentLink);
          }, [currentLink]);

          const handleFileChange = (e) => {
            if(e.target.files && e.target.files[0]) handleFormChange(field, e.target.files[0]);
          };

          const handleCancel = () => {
             handleFormChange(field, null); 
             if (currentLink) setIsEditing(false); 
          };

          const isInvalid = !currentLink && !selectedFile;

          return (
            <div className={`mb-4 p-3.5 md:p-4 rounded-[1.5rem] border shadow-sm transition-all duration-300 ${darkMode ? 'bg-slate-800/80 border-slate-700' : 'bg-white border-slate-200'} ${isInvalid ? 'ring-2 ring-red-400/50' : ''}`}>
               
               <div className="flex justify-between items-center mb-3">
                  <label className={`text-[10px] md:text-xs font-black uppercase tracking-wider ${darkMode ? 'text-slate-300' : 'text-slate-700'}`}>
                    {label} <span className="text-red-500">*</span>
                  </label>
                  {selectedFile ? (
                     <span className="bg-emerald-100 text-emerald-700 text-[8px] md:text-[9px] font-black px-2 py-1 rounded-md border border-emerald-200 flex items-center gap-1"><CheckCircle size={10}/> SIAP UPLOAD</span>
                  ) : currentLink && !isEditing ? (
                     <span className="bg-blue-100 text-blue-700 text-[8px] md:text-[9px] font-black px-2 py-1 rounded-md border border-blue-200 flex items-center gap-1"><FileCheck size={10}/> BERKAS LAMA</span>
                  ) : (
                     <span className="bg-rose-100 text-rose-700 text-[8px] md:text-[9px] font-black px-2 py-1 rounded-md border border-rose-200 flex items-center gap-1"><AlertTriangle size={10}/> WAJIB DIISI</span>
                  )}
               </div>

               {currentLink && !isEditing && !selectedFile && (
                  <div className={`p-3 md:p-4 rounded-xl border flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 ${darkMode ? 'bg-slate-900/50 border-slate-600' : 'bg-slate-50 border-slate-200'}`}>
                     <div className="flex items-center gap-3">
                        <div className={`p-2 rounded-lg ${darkMode ? 'bg-blue-900/30' : 'bg-blue-100/50'}`}>
                           <FileImage size={24} className={darkMode ? 'text-blue-400' : 'text-blue-600'} />
                        </div>
                        <div>
                           <p className={`text-[10px] md:text-xs font-bold ${darkMode ? 'text-slate-300' : 'text-slate-700'}`}>Berkas Telah Tersimpan</p>
                           <p className={`text-[8px] md:text-[10px] ${darkMode ? 'text-slate-500' : 'text-slate-500'}`}>Anda dapat meninjau atau mengubah berkas ini.</p>
                        </div>
                     </div>
                     <div className="flex gap-2 w-full sm:w-auto">
                        <a href={currentLink} target="_blank" rel="noreferrer" className={`flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-lg text-[9px] md:text-[10px] font-bold transition-all border shadow-sm ${darkMode ? 'bg-slate-800 border-slate-600 text-blue-400 hover:bg-slate-700' : 'bg-white border-slate-200 text-blue-600 hover:bg-slate-50'}`}>
                           <ExternalLink size={12} /> Buka / Unduh
                        </a>
                        <button type="button" onClick={() => setIsEditing(true)} className={`flex-1 sm:flex-none flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-lg text-[9px] md:text-[10px] font-bold transition-all shadow-sm ${darkMode ? 'bg-blue-600 hover:bg-blue-500 text-white' : 'bg-blue-500 hover:bg-blue-600 text-white'}`}>
                           <RefreshCw size={12} /> Ganti File
                        </button>
                     </div>
                  </div>
               )}

               {(isEditing || selectedFile || !currentLink) && (
                  <div className={`relative border-2 border-dashed rounded-xl p-4 md:p-6 flex flex-col items-center justify-center text-center transition-all duration-300 ${selectedFile ? (darkMode ? 'border-emerald-500/50 bg-emerald-900/10' : 'border-emerald-400 bg-emerald-50/50') : (darkMode ? 'border-slate-600 bg-slate-900/30 hover:border-blue-500/50' : 'border-slate-300 bg-slate-50 hover:border-blue-400')}`}>
                     
                     {selectedFile ? (
                        <div className="w-full flex flex-col items-center animate-in zoom-in-95">

                              <div className="relative w-24 h-24 md:w-32 md:h-32 mb-3 rounded-lg overflow-hidden border-2 border-emerald-500 shadow-md bg-white">
                                 <img src={previewUrl} alt="Preview" className="w-full h-full object-cover" />

                           <p className={`text-[10px] md:text-xs font-bold truncate max-w-[200px] md:max-w-xs ${darkMode ? 'text-emerald-400' : 'text-emerald-700'}`}>{selectedFile.name}</p>
                           <p className={`text-[8px] md:text-[9px] mt-0.5 mb-3 ${darkMode ? 'text-slate-400' : 'text-slate-500'}`}>Ukuran: {(selectedFile.size / 1024 / 1024).toFixed(2)} MB</p>
                           <div className="flex gap-2">

                                 <Trash2 size={12} /> Hapus & Batal
                              </button>
                           </div>
                        </div>
                     ) : (
                        <div className="w-full">
                           <div className={`mx-auto w-12 h-12 md:w-14 md:h-14 rounded-full mb-3 flex items-center justify-center ${darkMode ? 'bg-slate-800 shadow-inner' : 'bg-white shadow-sm'}`}>
                              <UploadCloud size={24} className={darkMode ? 'text-blue-400' : 'text-blue-500'} />

                </div>
              </div>

        const CascadingAddress = React.memo(({ prefix = "", title = "Alamat Sesuai KK", hideDetail = false, hideDesa = false, selectedGuru, editForm, handleFormChange, darkMode }) => {

          const findIdByName = (list, name) => {

                    </div>

            setUploadStatus('loading');
            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const data = new Uint8Array(event.target.result);
                const workbook = window.XLSX.read(data, { type: 'array' });
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonData = window.XLSX.utils.sheet_to_json(worksheet);

                   let newRow = {};
                   for(let k in row) newRow[k.toLowerCase()] = row[k];
                   return newRow;
                });

                const isSiswaFile = Object.keys(normalizedData[0] || {}).includes('nisn');
                setUploadRole(isSiswaFile ? 'Siswa' : 'Guru');

                  <h3 className="text-white font-black text-xl tracking-tight">Tunggu Dulu Bestie! 🚨</h3>
                </div>
                <div className="p-5 text-center text-xs font-medium">
                  <p className={`mb-3 ${darkMode ? 'text-slate-300' : 'text-slate-600'}`}>Apakah paduka sudah yakin bahwa data yang diinput ini sudah valid dan benar?</p>
                  <div className={`p-3 rounded-xl text-[10px] font-bold shadow-inner ${darkMode ? 'bg-orange-900/30 border border-orange-900/50 text-orange-400' : 'bg-orange-50 border border-orange-100 text-orange-700'}`}>
                    "Segala bentuk pemalsuan data akan dipertanggungjawabkan di dunia, akhirat, dan ruang Kepala Sekolah! 🤣"
                  </div>
                </div>
                <div className={`p-3 flex flex-col gap-2 ${darkMode ? 'bg-slate-900' : 'bg-slate-50'}`}>
                  <button onClick={confirmSave} disabled={isSaving} className="w-full py-3.5 text-xs font-extrabold text-white bg-gradient-to-r from-emerald-500 to-teal-600 rounded-xl shadow-lg shadow-emerald-500/30 active:scale-95 transition-transform flex justify-center items-center gap-1.5 disabled:opacity-70">
                     {isSaving ? <Loader2 size={16} className="animate-spin" /> : <CheckCircle size={16} />} 
                     {isSaving ? 'MENGIRIM KE GAS...' : 'YAKIN 1000% GAS SIMPAN!'}
                  </button>
                  <button onClick={() => setShowConfirmModal(false)} disabled={isSaving} className={`w-full py-3 text-xs font-bold rounded-xl ${darkMode ? 'bg-slate-800 text-slate-400 hover:bg-slate-700' : 'bg-white text-slate-500 border border-slate-200 hover:bg-slate-100'}`}>
                    Ampun, Cek Lagi 🙏
                  </button>
                </div>
              </div>
            </div>
          );

          return (
            <div className={`min-h-screen font-sans transition-colors duration-500 ${darkMode ? 'bg-slate-950 text-slate-300' : 'bg-slate-50 text-slate-800'}`}>
              {appLoading && <SplashScreen isFading={splashFading} />}

              {!appLoading && (
                <>
                  {currentView !== 'admin' && renderHeader()}
                  <main>
                    {currentView === 'home' && renderHome()}
                    {currentView === 'search_guru' && renderSearchGuru()}
                    {currentView === 'search_siswa' && renderSearchSiswa()}
                    {currentView === 'verval_guru' && renderVervalGuru()}
                    {currentView === 'verval_siswa' && renderVervalSiswa()}
                    {currentView === 'admin' && renderAdmin()}
                  </main>

                  {showConfirmModal && renderConfirmModal()}
                  {popupError && renderErrorModal()}
                  {showDevPopup && renderDevModal()}
                  {showInstallModal && renderInstallModal()}
                  {showAdminAuth && renderAdminAuthModal()}
                  {datePickerConfig && (
                    <CustomDatePickerModal 
                      config={datePickerConfig} editForm={editForm} 
                      onSave={(field, val) => { handleFormChange(field, val); setDatePickerConfig(null); }} 
                      onClose={() => setDatePickerConfig(null)} darkMode={darkMode}
                    />
                  )}
                </>
              )}
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
